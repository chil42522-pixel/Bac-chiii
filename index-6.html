const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function tone(freq,dur=.12,type='sine'){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext,ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur+.02)}catch(e){}}
function correct(){tone(660,.09);setTimeout(()=>tone(880,.13),80)}function wrong(){tone(180,.14,'triangle')}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.82;speechSynthesis.speak(u)}}
function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.dataset.mode===m))}

function start(){let n=+$('count').value;questions=shuffle(VOCAB).slice(0,n);i=0;score=good=bad=combo=0;$('game').classList.remove('hide');$('end').classList.add('hide');render()}
$('start').onclick=start;
function render(){if(i>=questions.length)return finish();answered=false;$('score').textContent=score;$('good').textContent=good;$('bad').textContent=bad;$('combo').textContent=combo;$('fillbar').style.width=(i/questions.length*100)+'%';$('feedback').textContent='';let x=questions[i];if(mode==='translate')renderTranslate(x);else if(mode==='fill')renderFill(x);else renderWrite(x)}
function renderTranslate(x){let opts=shuffle([x.v,...shuffle(VOCAB.filter(y=>y.id!==x.id)).slice(0,3).map(y=>y.v)]);$('question').innerHTML='<div class="small">Câu '+(i+1)+' / '+questions.length+'</div><div class="word">'+x.h+'</div><div class="pinyin">'+x.p+'</div><div class="small">Chọn nghĩa đúng:</div><div class="opts">'+opts.map(v=>'<button class="opt" data-v="'+esc(v)+'">'+v+'</button>').join('')+'</div>';$('question').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,x,b.dataset.v===x.v))}
function esc(s){return s.replaceAll('\','\\').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
const templates=[x=>`我每天${x.h}。`,x=>`我想${x.h}。`,x=>`你會${x.h}嗎？`,x=>`我們一起${x.h}吧！`,x=>`我很喜歡${x.h}。`,x=>`今天我要${x.h}。`,x=>`他正在${x.h}。`];
function renderFill(x){let s=templates[i%templates.length](x);$('question').innerHTML='<div class="small">Câu '+(i+1)+' / '+questions.length+' • Hãy chọn từ thích hợp</div><div class="sentence">'+s.replace(x.h,'<span class="blank">?</span>')+'</div><div class="pinyin">'+x.p+'</div><div class="opts">'+shuffle([x.h,...shuffle(VOCAB.filter(y=>y.id!==x.id)).slice(0,3).map(y=>y.h)]).map(v=>'<button class="opt" data-v="'+esc(v)+'">'+v+'</button>').join('')+'</div>';$('question').querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b,x,b.dataset.v===x.h))}
function renderWrite(x){$('question').innerHTML='<div class="small">Câu '+(i+1)+' / '+questions.length+' • Dùng từ này để đặt câu</div><div class="word">'+x.h+'</div><div class="pinyin">'+x.p+'</div><div class="meaning">'+x.v+'</div><input id="ans" class="input" placeholder="Ví dụ: 我喜歡'+x.h+'。"><button class="btn" id="submit">✅ Chấm câu</button>';$('submit').onclick=()=>{let v=$('ans').value.trim();let ok=v.includes(x.h)&&v.length>=4;answer(null,x,ok);if(ok)speak(v)}}
function answer(btn,x,ok){if(answered)return;answered=true;if(btn){btn.classList.add(ok?'correct':'wrong');if(!ok)$('question').querySelectorAll('.opt').forEach(b=>{if(b.dataset.v===String(mode==='translate'?x.v:x.h))b.classList.add('correct')})}if(ok){good++;combo++;score+=10+Math.min(combo,10)*2;correct();$('feedback').innerHTML='<span class="ok">🎉 Chính xác! +'+(10+Math.min(combo,10)*2)+' điểm</span>';speak(x.h)}else{bad++;combo=0;score=Math.max(0,score-3);wrong();$('feedback').innerHTML='<span class="danger">😅 Chưa đúng. Đáp án: '+(mode==='translate'?x.v:x.h)+'</span>';speak(x.h)}$('score').textContent=score;$('good').textContent=good;$('bad').textContent=bad;$('combo').textContent=combo;setTimeout(()=>{i++;render()},mode==='write'?1200:850)}
